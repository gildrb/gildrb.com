name: Atmosphere prototype checks
on:
  push:
    branches: [prototype/vgpu-atmosphere-background]
  pull_request:
    paths: ['atmosphere/**', 'src/atmosphere-background/**', 'src/page.template.html', 'scripts/**', 'tests/**', 'package*.json', 'vite.config.mjs', '.github/workflows/atmosphere-prototype.yml']
permissions:
  contents: read
concurrency:
  group: atmosphere-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify upstream hashes and lifecycle behavior
        run: node --test tests/atmosphere*.test.mjs
      - name: Build actual website and downloadable prototype
        run: |
          npm run build
          node scripts/export-atmosphere-prototype.mjs
      - name: Compare existing verifier against unchanged baseline
        run: node tests/compare-baseline.mjs
      - name: Render actual WGSL through native WebGPU
        run: |
          npm exec --no -- vgpu install-software-renderer
          mkdir -p validation
          npm exec --no -- vgpu doctor > validation/doctor.json
          node tests/build-real.mjs
          RENDER_HOUR=12 RENDER_NAME=noon node .test-build/render-real.mjs
          RENDER_HOUR=19 RENDER_NAME=evening node .test-build/render-real.mjs
          RENDER_HOUR=0 RENDER_NAME=night node .test-build/render-real.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atmosphere-prototype
          path: |
            prototype/gildrb-rain.html
            validation/
          retention-days: 7
          if-no-files-found: error

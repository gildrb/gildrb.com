name: Atmosphere test toolkit
on:
  push:
    branches: [prototype/vgpu-atmosphere-background]
    paths: [.github/workflows/atmosphere-toolkit.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/toolkit/browsers
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headed Chromium test browser
        run: |
          mkdir -p /tmp/toolkit
          npm install --prefix /tmp/toolkit playwright --no-audit --no-fund
          /tmp/toolkit/node_modules/.bin/playwright install chromium --no-shell
          tar -C /tmp/toolkit -czf /tmp/vgpu-headed-browser.tar.gz browsers
      - uses: actions/upload-artifact@v4
        with:
          name: vgpu-headed-browser
          path: /tmp/vgpu-headed-browser.tar.gz
          retention-days: 3

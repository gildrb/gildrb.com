name: Apply verified rework
on:
  push:
    branches: [rework]
    paths: [.github/workflows/rework-import.yml]
permissions:
  contents: write
concurrency:
  group: rework-import
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/rework'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRANSFER_BASE: 5ad0f4edf07478f09792f262cb1477fb95ff6b6d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rework
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and reconstruct source delta
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const base = process.env.TRANSFER_BASE;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 });
          git('merge-base', '--is-ancestor', base, 'HEAD');
          const sinceBase = git('diff', '--name-only', base, 'HEAD').trim().split('\n').filter(Boolean);
          assert.ok(sinceBase.every(p => /^\.rework-transfer\/[1-4]$/.test(p) || p === '.github/workflows/rework-import.yml'), 'Unexpected concurrent edits: refusing to overwrite source');
          const hashes = [
            '0fd392c9e8e95144790d9fcbd3da231ece9aaa15830737c29260fb73a9db2e56',
            '127253438aa39de227d91be0a1bb8bec0e616a7a39e0ae4ef54fdbf3dc4d89a5',
            '9668a1f90abf88a80adcf4e37fae3930e9f5f9b2d0a95c69d6b0339f32951085',
            '10d6ce9fc7dac1b6892c072437909206e4d4baf7512313340f26c74d9f72315d',
          ];
          const digest = data => createHash('sha256').update(data).digest('hex');
          const chunks = hashes.map((sha, i) => {
            const text = fs.readFileSync(`.rework-transfer/${i + 1}`, 'utf8');
            assert.equal(digest(text), sha, `Transfer chunk ${i + 1} checksum`);
            return text;
          });
          const compressed = Buffer.from(chunks.join(''), 'base64');
          assert.equal(compressed.length, 46648);
          assert.equal(digest(compressed), '4230feb6f3b072cd0466907196486978f238c6041c1dbe55fe3fdcbf3172b53f');
          const entries = JSON.parse(brotliDecompressSync(compressed).toString('utf8'));
          assert.equal(entries.length, 197);
          function valid(p) {
            assert.equal(typeof p, 'string');
            assert.ok(p && !path.isAbsolute(p) && !p.includes('\\') && !p.includes('\0') && !p.split('/').includes('..'));
            assert.ok(!/^(?:\.git\/|node_modules\/|dist\/)/.test(p));
            assert.ok(!/\.(woff2?|ttf|otf)$/i.test(p));
          }
          const writes = entries.map(entry => {
            valid(entry.path);
            if (entry.delete) return entry;
            let text = entry.text;
            if (entry.from) {
              valid(entry.from);
              const old = git('show', `${base}:${entry.from}`);
              const lines = old.match(/[^\n]*\n|[^\n]+$/g) ?? [];
              text = entry.lines.map(part => {
                if (typeof part === 'string') return part;
                const [start, count] = part;
                assert.ok(Number.isInteger(start) && Number.isInteger(count) && start >= 0 && count >= 0 && start + count <= lines.length);
                return lines.slice(start, start + count).join('');
              }).join('');
            }
            assert.equal(digest(text), entry.sha256, `Reconstructed ${entry.path}`);
            return { ...entry, text };
          });
          for (const entry of writes) {
            if (entry.delete) fs.rmSync(entry.path, { force: true });
            else {
              fs.mkdirSync(path.dirname(entry.path), { recursive: true });
              fs.writeFileSync(entry.path, entry.text);
            }
          }
          for (let i = 1; i <= 4; i++) fs.rmSync(`.rework-transfer/${i}`);
          fs.rmdirSync('.rework-transfer');
          fs.rmSync('.github/workflows/rework-import.yml');
          fs.rmSync('package-lock.json', { force: true });
          fs.mkdirSync('validation', { recursive: true });
          fs.writeFileSync('validation/transfer.json', JSON.stringify({ base, entries: entries.length, status: 'all target checksums verified' }, null, 2));
          console.log('Verified and applied all 197 source changes. Temporary transfer files removed.');
          NODE
      - name: Resolve the exact new dependency manifest
        run: npm install --no-audit --no-fund
      - name: Execute the sky-only WebGPU graph
        run: |
          npm exec --no -- vgpu install-software-renderer
          npm run test:gpu
      - name: Generate first-paint posters from actual shader output
        run: |
          python3 -m venv /tmp/rework-images
          /tmp/rework-images/bin/pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/rework-images/bin/python <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          out = Path('src/static/environment')
          out.mkdir(parents=True, exist_ok=True)
          files = []
          for phase in ('day', 'dusk', 'night'):
              for suffix in ('', '-wide'):
                  name = phase + suffix
                  image = Image.open(Path('validation') / (name + '.png')).convert('RGB')
                  target = out / (name + '.webp')
                  image.save(target, 'WEBP', quality=84, method=6)
                  data = target.read_bytes()
                  files.append({'file': target.name, 'size': list(image.size), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          provenance = {'renderer': 'src/environment/graph.ts', 'upstream': 'atmosphere/PROVENANCE.md', 'backend': 'vgpu/node 0.5.0, Dawn/Mesa CPU', 'states': {'day': '12:00', 'dusk': '17:59', 'night': '00:00'}, 'simulationTime': 8, 'files': files}
          (out / 'provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print(json.dumps(provenance, indent=2))
          PY
      - name: Typecheck, lint, unit tests, prerender and budgets
        run: npm run verify
      - name: Browser viewport, navigation and delayed-GPU checks
        run: |
          npm exec --no -- playwright install chromium --only-shell --with-deps
          npm run preview -- --host 127.0.0.1 --port 5175 > /tmp/rework-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5175/ > /dev/null && break || sleep 1; done
          npm run test:browser
      - name: Commit validated source only to rework
        run: |
          test "$GITHUB_REF" = refs/heads/rework
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'refactor: Vite+ Preact TypeScript portfolio with fast VGPU sky startup'
          git push origin HEAD:rework
          git rev-parse HEAD > validation/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rework-import-validation
          path: validation/
          retention-days: 7
          if-no-files-found: warn
